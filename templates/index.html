<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translation Tool</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <header>
            <h1>🌐 Language Translation Tool</h1>
            <p>Translate text quickly and easily using AI-powered translation.</p>
        </header>

        <main class="translator-card">

            <!-- Language Selection -->
            <div class="language-selection">

                <div class="language-box">
                    <label for="sourceLanguage">From</label>

                    <select id="sourceLanguage">
                        <option value="auto">Auto Detect</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                        <option value="ta">Tamil</option>
                        <option value="kn">Kannada</option>
                        <option value="ml">Malayalam</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="zh-CN">Chinese</option>
                        <option value="ar">Arabic</option>
                    </select>
                </div>

                <button id="swapButton" class="swap-button" title="Swap languages">
                    ⇄
                </button>

                <div class="language-box">
                    <label for="targetLanguage">To</label>

                    <select id="targetLanguage">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                        <option value="ta">Tamil</option>
                        <option value="kn">Kannada</option>
                        <option value="ml">Malayalam</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="zh-CN">Chinese</option>
                        <option value="ar">Arabic</option>
                    </select>
                </div>

            </div>


            <!-- Translation Areas -->
            <div class="translation-area">

                <div class="text-box">
                    <textarea
                        id="inputText"
                        placeholder="Enter text you want to translate..."
                        maxlength="5000"
                    ></textarea>

                    <div class="text-footer">
                        <span id="characterCount">0 / 5000</span>

                        <button id="clearButton" class="small-button">
                            Clear
                        </button>
                    </div>
                </div>


                <div class="text-box result-box">

                    <textarea
                        id="outputText"
                        placeholder="Translation will appear here..."
                        readonly
                    ></textarea>

                    <div class="text-footer">

                    <span id="statusMessage"></span>

                    <div class="output-actions">
                        <button id="speakButton" class="small-button">
                            🔊 Listen
                        </button>

                        <button id="stopButton" class="small-button">
                            ⏹ Stop
                        </button>

                        <button id="copyButton" class="small-button">
                            📋 Copy
                        </button>
                    </div>

                </div>


            <!-- Translate Button -->
            <button id="translateButton" class="translate-button">
                Translate
            </button>

        </main>


        <footer>
            <p>Language Translation Tool • CodeAlpha Internship Task 1</p>
        </footer>

    </div>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>

</body>
</html>
